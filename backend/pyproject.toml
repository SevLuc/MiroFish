[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Zep Cloud (legacy graph backend — kept for GRAPH_BACKEND=zep; dormant by default per ADR 0009)
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",

    # Graphiti — self-hosted graph backend (GRAPH_BACKEND=graphiti, ADR 0009). Same engine Zep runs;
    # drives a local FalkorDB. `falkordb` (the client) is declared directly rather than via the
    # `[falkordb]` extra: the extra only exists on newer graphiti-core releases, and pinning through
    # it made uv silently backtrack to an ancient 0.11.x. Pin to the 0.29 line the adapter targets.
    "graphiti-core>=0.29,<0.30",
    "falkordb>=1.1.2,<2.0.0",
    # Free local embeddings (fastembed/ONNX, no key) so the backend runs on the existing OpenRouter
    # key alone — OpenRouter has no embeddings endpoint. Only needed for GRAPHITI_EMBEDDER=local.
    "fastembed>=0.3.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[tool.uv]
# camel-oasis 0.2.5 hard-pins neo4j==5.23.0; graphiti-core 0.29 needs neo4j>=5.26.0. Neither our
# code path (FalkorDB) nor MiroFish's OASIS sim uses the neo4j driver — it is an inert transitive
# dep — so force a single 5.26 (an LTS) to satisfy graphiti and keep the adapter on 0.29 (ADR 0009).
override-dependencies = ["neo4j==5.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
